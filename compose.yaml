services:
  gateway:
    build: ./services/gateway
    environment:
      DATABASE_URL: postgres://threatscanner:local-development-only@postgres:5432/threatscanner?sslmode=disable
      REDIS_ADDR: redis:6379
      SCANNER_URL: http://scanner:8000
      SCANNER_SERVICE_TOKEN: ${SCANNER_SERVICE_TOKEN:?SCANNER_SERVICE_TOKEN is required}
      AUTH_URL: http://auth:8001
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?AUTH_SERVICE_TOKEN is required}

    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scanner:
        condition: service_healthy
      auth:
        condition: service_healthy

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    environment:
       DATABASE_URL: postgresql://threatscanner:local-development-only@postgres:5432/threatscanner
       REDIS_URL: redis://redis:6379
    depends_on:
       postgres:
         condition: service_healthy
       redis:
         condition: service_healthy
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: threatscanner
      POSTGRES_USER: threatscanner
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U threatscanner -d threatscanner
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7.4.11-bookworm
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
  
  scanner:
    build:
      context: ./services/scanner
      dockerfile: Dockerfile
    environment:
      SERVICE_TOKEN: ${SCANNER_SERVICE_TOKEN:?SCANNER_SERVICE_TOKEN is required}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://threatscanner:local-development-only@postgres:5432/threatscanner
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?AUTH_SERVICE_TOKEN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: 
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  postgres-data:
  redis-data: